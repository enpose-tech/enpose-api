[package]
name = "enpose-api"
version = "0.2.0"
description = "Public Rust API for the Enpose 6-DoF tracking system"

edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/enpose-tech/enpose-api"
homepage = "https://enpose.tech"
authors = ["Enpose"]
readme = "README.md"
documentation = "https://enpose.tech/docs/rust/enpose_api/index.html"
categories = ["science::robotics", "computer-vision", "hardware-support"]


[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "example"
path = "example/example.rs"

[dependencies]
# Network discovery and pose streaming. Gated behind the default `net`
# feature so the wire types can be built for targets without a sockets
# stack (e.g. wasm32) via `default-features = false`.
if-addrs = { version = "0.13", optional = true }

[features]
default = ["net"]
# Enables the networking parts of the API (DeviceDiscovery, PoseStream).
# Without it, only the wire types and pure protocol constants compile.
net = ["dep:if-addrs"]
